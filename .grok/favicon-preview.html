<!doctype html>
<html>
<head>
  <style>
    body { margin: 0; background: #3a3a3a; font: 11px/1.3 ui-sans-serif, system-ui; color: #eee; }
    .row { display: flex; gap: 20px; align-items: flex-end; padding: 16px; }
    .cell { text-align: center; }
    img { display: block; }
    .light img { background: #fff; }
    .dark img { background: #1a1a1a; }
    .s16 img { width: 16px; height: 16px; }
    .s32 img { width: 32px; height: 32px; }
    .s64 img { width: 64px; height: 64px; }
    .s128 img { width: 128px; height: 128px; }
    h2 { margin: 12px 16px 0; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>stroke italic np — light / dark</h2>
  <div class="row light">
    <div class="cell s16"><img src="favicon.svg.tmp" alt="16"><div>16</div></div>
    <div class="cell s32"><img src="favicon.svg.tmp" alt="32"><div>32</div></div>
    <div class="cell s64"><img src="favicon.svg.tmp" alt="64"><div>64</div></div>
    <div class="cell s128"><img src="favicon.svg.tmp" alt="128"><div>128</div></div>
  </div>
  <div class="row dark">
    <div class="cell s16"><img src="favicon.svg.tmp" alt="16"><div>16</div></div>
    <div class="cell s32"><img src="favicon.svg.tmp" alt="32"><div>32</div></div>
    <div class="cell s64"><img src="favicon.svg.tmp" alt="64"><div>64</div></div>
    <div class="cell s128"><img src="favicon.svg.tmp" alt="128"><div>128</div></div>
  </div>
  <h2>Georgia italic np — light / dark</h2>
  <div class="row light">
    <div class="cell s16"><img src="favicon-text.svg.tmp" alt="16"><div>16</div></div>
    <div class="cell s32"><img src="favicon-text.svg.tmp" alt="32"><div>32</div></div>
    <div class="cell s64"><img src="favicon-text.svg.tmp" alt="64"><div>64</div></div>
    <div class="cell s128"><img src="favicon-text.svg.tmp" alt="128"><div>128</div></div>
  </div>
  <div class="row dark">
    <div class="cell s16"><img src="favicon-text.svg.tmp" alt="16"><div>16</div></div>
    <div class="cell s32"><img src="favicon-text.svg.tmp" alt="32"><div>32</div></div>
    <div class="cell s64"><img src="favicon-text.svg.tmp" alt="64"><div>64</div></div>

</html>
